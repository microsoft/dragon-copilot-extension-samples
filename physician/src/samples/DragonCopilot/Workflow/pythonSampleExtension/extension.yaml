schemaVersion: 0.3.0
name: sample-clinical-extraction-py
caption: Sample Clinical Extraction (Python)
description: Python FastAPI version of clinical entity extraction sample
version: 0.0.1
auth:
  tenantId: 00000000-0000-0000-0000-000000000000
tools:
  - name: clinical-entity-extractor-py
    caption: Clinical Entity Extractor (Python)
    description: Extracts certain clinical entities (Python FastAPI)
    type: DragonAPI
    triggers:
      - DataAvailable
    endpoint: http://localhost:5181/v1/process
    inputs:
      - name: note
        description: Note
        content-type: application/vnd.ms-dragon.dsp.note+json
    outputs:
      - name: sample-entities
        description: Coded clinical entities
        content-type: application/vnd.ms-dragon.dsp+json
      - name: adaptive-card
        description: Coded clinical entities in Adaptive Card format
        content-type: application/vnd.ms-dragon.dsp+json
