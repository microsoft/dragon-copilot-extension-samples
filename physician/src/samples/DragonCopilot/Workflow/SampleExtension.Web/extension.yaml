schemaVersion: 0.3.0
name: sample-clinical-extraction
caption: Sample Clinical Extraction
description: Extracts certain clinical entities
version: 0.0.1
auth:
  tenantId: 00000000-0000-0000-0000-000000000000
tools:
  - name: clinical-entity-extractor
    caption: Clinical Entity Extractor
    description: Extracts certain clinical entities
    type: DragonAPI
    triggers:
      - DataAvailable
    timeout: 60
    endpoint: http://localhost:5181/v1/process
    inputs:
      - name: note
        description: Note
        content-type: application/vnd.ms-dragon.dsp.note+json
    outputs:
      - name: sample-entities
        description: Coded clinical entities
        content-type: application/vnd.ms-dragon.dsp+json
      - name: adaptive-card
        description: Coded clinical entities in Adaptive Card format
        content-type: application/vnd.ms-dragon.dsp+json
