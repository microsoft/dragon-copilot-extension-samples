# Dragon Copilot conversational extension manifest for the MCP sample server.
# Replace the tenant ID and endpoint host with your own before packaging.
# yaml-language-server: $schema=../../../../../../../tools/dragon-copilot-cli/src/schemas/physician/physician-extension-manifest-schema-0.4.0-preview.2.json

schemaVersion: 0.4.0-preview.2
name: contoso-clinical-mcp
caption: Contoso Clinical MCP
description: Sample MCP server exposing clinical reference and order-extraction tools.
version: 0.1.0

auth:
  tenantId: 00000000-0000-0000-0000-000000000000

tools:
  - name: clinical-reference
    caption: Clinical Reference
    # For MCP tools this is server-level context shared by all the server's tools.
    # Each MCP tool's own description and input schema decide when it is called.
    description: Lab reference data. Returns typical adult reference ranges for common lab tests; values are synthetic and are not patient results.
    type: MCP
    endpoint: https://your-mcp-host.example.com/mcp
    triggers:
      - IntentDriven
    expose:
      - lookup_reference_range
    customExtractors:
      lookup_reference_range:
        - propertyPath: $.summary
          extractorType: Response Text
    timeout: 10

  - name: order-extraction
    caption: Order Extraction
    description: Order extraction from the current encounter.
    type: MCP
    endpoint: https://your-mcp-host.example.com/mcp
    triggers:
      - IntentDriven
    expose:
      - extract_orders
    customExtractors:
      extract_orders:
        - propertyPath: $.summary
          extractorType: Response Text
    runtimeParamBindings:
      extract_orders:
        - source: transcript
          target: argument
          path: transcript
          required: true
        - source: patientContext   # PHI: log the source name only, never the value
          target: argument
          path: patientContext
          required: false
        - source: conversationId
          target: sideChannel
          path: dragon.conversationId
    timeout: 10
