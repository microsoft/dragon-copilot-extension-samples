# Dragon Copilot conversational extension manifest for the OpenAPI sample.
# Replace the tenant ID and specUrl host with your own before packaging.
# yaml-language-server: $schema=../../../../../../../tools/dragon-copilot-cli/src/schemas/physician/physician-extension-manifest-schema-0.4.0-preview.2.json

schemaVersion: 0.4.0-preview.2
name: contoso-drug-interactions
caption: Contoso Drug Interactions
description: Sample OpenAPI service that checks interactions between two medications.
version: 0.1.0

auth:
  tenantId: 00000000-0000-0000-0000-000000000000

tools:
  - name: drug-interaction-check
    caption: Drug Interaction Check
    # For OpenAPI tools these are short server notes shared by all the service's operations.
    # Each operation's own description and parameters decide when it is called.
    description: Drug interaction checks for medication pairs. Medication names are generic or brand names as the clinician said them.
    type: OpenAPI
    specUrl: https://your-api-host.example.com/openapi/v1.json
    triggers:
      - IntentDriven
    expose:
      - checkDrugInteraction
    customExtractors:
      checkDrugInteraction:
        - propertyPath: $.summary
          extractorType: Response Text
        - propertyPath: $.sources[*].url
          extractorType: Evidence Link
    runtimeParamBindings:
      checkDrugInteraction:
        - source: locale
          path: locale
        - source: patientContext   # PHI: log the source name only, never the value
          path: patientContext     # body (default); declared as optional in the OpenAPI spec
          required: false
        - source: correlationId
          target: header
          path: x-correlation-id
    timeout: 10
