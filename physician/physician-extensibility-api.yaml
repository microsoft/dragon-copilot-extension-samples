openapi: 3.0.0
info:
  title: Dragon Extensibility API
  # MAJOR: Reserved for breaking changes (incompatible API changes)
  # MINOR: For non-breaking additions (new headers, parameters, fields in top-level schemas)
  # PATCH: For backward-compatible bug fixes and improvements
  version: 1.2.0
  description: API definition for enabling Dragon Extensibility integrations

paths:
  /v1/process:
    post:
      summary: Process Dragon Standard payload
      description: Endpoint to trigger processing within an extension. Receives inputs in the Dragon Standard payload containing note, transcript, iterative transcript and / or iterative audio data.
      operationId: processDragonStandard
      parameters:
        - name: api-version
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z\-]+(\.[0-9A-Za-z\-]+)*)?(\+[0-9A-Za-z\-]+(\.[0-9A-Za-z\-]+)*)?$'
            example: "1.2.0"
          description: API version in semantic versioning format (e.g., 1.2.0, 1.2.0-alpha, 1.2.0-beta.1, 1.2.0+build.1). Major version reserved for breaking changes, minor for non-breaking additions, patch for backward-compatible fixes. Pre-release identifiers (alpha, beta, rc) and build metadata are supported.
        - name: x-ms-request-id
          in: header
          required: false
          schema:
            type: string
          description: Unique request identifier. In case of retries for the same call, this value is the same.
        - name: x-ms-correlation-id
          in: header
          required: false
          schema:
            type: string
          description: Correlation identifier for tracking. Stays the same for the entire execution of multiple extensions in the scope of single execution flow.
        - name: x-dre-custom-header
          in: header
          description: Arbitrary custom DRagon Extension header. Any number of custom headers with the x-dre- prefix are allowed. They originate from the installation of the extension and are passed through to the extension.
          required: false
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DragonStandardPayload"
      responses:
        "200":
          description: Successfully processed
          content:
            application/json:
              schema:
                $ref: "dsp-0.1.json#/definitions/ProcessResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Invalid payload format"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Unauthorized."
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Internal server error occurred"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DragonStandardPayload:
      type: object
      description: Dragon Standard payload containing session data, and note, transcript, iterative transcript and / or iterative audio data
      required:
        - sessionData
      properties:
        extensibilityApiVersion:
          type: string
          example: "1.2.0"
        sessionData:
          $ref: "#/components/schemas/SessionData"
      additionalProperties:
        oneOf:
          - $ref: "dsp-0.1.json#/definitions/Note"
          - $ref: "dsp-0.1.json#/definitions/Transcript"
          - $ref: "dsp-0.1.json#/definitions/IterativeTranscript"
          - $ref: "dsp-0.1.json#/definitions/IterativeAudio"
          - $ref: "#/components/schemas/FhirBundle"
          - type: object
            description: Custom JSON payload

    FhirBundle:
      description: |
        FHIR R4 Bundle resource carrying platform-sourced EHR context (for example
        provider, patient, and encounter resources). Its shape is governed by the
        official HL7 FHIR R4 specification; this entry defers to that authoritative
        schema rather than restating it locally.
      externalDocs:
        description: HL7 FHIR R4 — Bundle
        url: https://hl7.org/fhir/R4/bundle.html
      allOf:
        - $ref: "https://hl7.org/fhir/R4/fhir.schema.json#/definitions/Bundle"

    SessionData:
      type: object
      properties:
        correlation_id:
          type: string
          example: "f40dd0d0-4201-d29d-79b4-df40189fd2f0"
        session_start:
          type: string
          format: date-time
          example: "2025-06-20T08:57:35.978Z"
        environment_id:
          type: string
          example: "01bd0d47-1621-4a29-941d-00e9a9420f20"
        customer_tenant_id:
          type: string
          example: "01bd0d47-1621-4a29-941d-00e9a9420f20"