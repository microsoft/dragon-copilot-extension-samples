# Valid conversational manifest cases (runtimeparambindings). Each case MUST pass schema validation.
# A "tool" case is wrapped in a minimal manifest envelope before validation.

- description: OpenAPI binds transcript into the body (target defaults to body)
  tool:
    name: openapi-bind-default-body
    caption: OpenAPI Default Body
    description: Body binding with no explicit target.
    type: OpenAPI
    triggers:
      - IntentDriven
    specUrl: https://api.example.com/openapi.json
    runtimeParamBindings:
      summarizeEncounter:
        - source: transcript
          path: payload.transcript
          required: true
- description: OpenAPI binds body and header across two operations
  tool:
    name: openapi-bind-body-header
    caption: OpenAPI Body And Header
    description: Explicit body and header bindings, keyed per operationId.
    type: OpenAPI
    triggers:
      - IntentDriven
    specUrl: https://api.example.com/openapi.json
    runtimeParamBindings:
      summarizeEncounter:
        - source: transcript
          target: body
          path: $.items[0].text
        - source: conversationId
          target: header
          path: x-conversation-id
      getPatient:
        - source: patientContext
          target: body
          path: context
        - source: locale
          target: header
          path: Accept-Language
- description: OpenAPI combines bindings with customExtractors on the same operation
  tool:
    name: openapi-bind-with-extractors
    caption: OpenAPI Bindings And Extractors
    description: Request-side and response-side mapping together.
    type: OpenAPI
    triggers:
      - IntentDriven
    specUrl: https://api.example.com/openapi.json
    customExtractors:
      summarizeEncounter:
        - propertyPath: $.summary
          extractorType: Response Text
    runtimeParamBindings:
      summarizeEncounter:
        - source: transcript
          path: transcript
- description: CopilotStudio binds explicit intent and sideChannel targets
  tool:
    name: cs-bind-all-targets
    caption: Copilot Studio All Locations
    description: Every target Copilot Studio supports.
    type: CopilotStudio
    triggers:
      - IntentDriven
    environmentId: 11111111-2222-3333-4444-555555555555
    agentIdentifier: my-agent
    runtimeParamBindings:
      - source: transcript
        target: intent
        path: transcript
        required: true
      - source: patientContext
        target: sideChannel
        path: dragon.patientContext
- description: CopilotStudio injects into the intent (target defaults to intent)
  tool:
    name: cs-bind-default-intent
    caption: Copilot Studio Default Intent
    description: No parameter slot, so the value is appended to the agent query.
    type: CopilotStudio
    triggers:
      - IntentDriven
    environmentId: 11111111-2222-3333-4444-555555555555
    agentIdentifier: my-agent
    runtimeParamBindings:
      - source: patientContext
        path: patientContext
        required: true
      - source: conversationId
        target: sideChannel
        path: conversationId
- description: OpenAPI binds every remaining source across body and header
  tool:
    name: openapi-bind-all-sources
    caption: OpenAPI All Sources
    description: Covers the full RuntimeParamSource enum.
    type: OpenAPI
    triggers:
      - IntentDriven
    specUrl: https://api.example.com/openapi.json
    runtimeParamBindings:
      summarizeEncounter:
        - source: transcript
          target: body
          path: transcript
        - source: patientContext
          target: body
          path: patient.context
        - source: conversationId
          target: header
          path: x-conversation-id
        - source: locale
          target: header
          path: Accept-Language
        - source: mrn
          target: body
          path: patient.mrn
        - source: sessionUniqueId
          target: body
          path: session.uniqueId
- description: OpenAPI binds transcriptTurns (inner transcript object, no wrapper)
  tool:
    name: openapi-bind-transcript-turns
    caption: OpenAPI Transcript Turns
    description: Partner expects the turns without the transcript wrapper.
    type: OpenAPI
    triggers:
      - IntentDriven
    specUrl: https://api.example.com/openapi.json
    runtimeParamBindings:
      summarizeEncounter:
        - source: transcriptTurns
          target: body
          path: transcript
          required: true
