# Valid conversational manifest cases (isexclusive). Each case MUST pass schema validation.
# A "tool" case is wrapped in a minimal manifest envelope before validation.

- description: MCP tool marked exclusive
  tool:
    name: mcp-exclusive
    caption: MCP Exclusive
    description: MCP tool that must not be blended with other tools.
    type: MCP
    triggers:
      - IntentDriven
    endpoint: https://mcp.example.com
    isExclusive: true
- description: CopilotStudio tool marked exclusive
  tool:
    name: cs-exclusive
    caption: Copilot Studio Exclusive
    description: Copilot Studio tool that must not be blended with other tools.
    type: CopilotStudio
    triggers:
      - IntentDriven
    environmentId: 11111111-2222-3333-4444-555555555555
    agentIdentifier: my-agent
    isExclusive: true
- description: isExclusive may be set false explicitly on a non-OpenAPI type
  tool:
    name: mcp-not-exclusive
    caption: MCP Not Exclusive
    description: MCP tool that opts out of exclusivity explicitly.
    type: MCP
    triggers:
      - IntentDriven
    endpoint: https://mcp.example.com
    isExclusive: false
